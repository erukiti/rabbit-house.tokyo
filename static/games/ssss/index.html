<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPARK STORM SPLASH SPREE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Chakra+Petch:wght@500;700&family=M+PLUS+1p:wght@500;700;800&display=swap">
<style>:root{--bg:#04050d;--panel:#0a0e22;--line:#25306a;--ink:#e8ecff;--dim:#7c86b0;--blue:#2f7dff;--gold:#ffd23a;--font-ui:"M PLUS 1p", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark}html,body{height:100%}body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);margin:0;overflow:hidden}.shell{box-sizing:border-box;flex-direction:column;gap:10px;height:100%;padding-block:12px;padding-inline:16px;display:flex}.stage{flex:1;place-items:center;min-height:0;display:grid}.screen{max-width:100%;box-shadow:0 0 0 1px var(--line), 0 24px 70px #000000a6;border-radius:4px;display:block}.bar{color:var(--dim);flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 14px;font-size:13px;display:flex}.bar button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);cursor:pointer;border-radius:3px;padding:6px 12px;font-size:13px}.bar button:hover{border-color:var(--blue)}.bar button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}.bar button[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}.keys{letter-spacing:.02em}.note{color:var(--gold)}dialog.code{box-sizing:border-box;background:var(--panel);width:min(640px,100vw - 32px);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:20px}dialog.code::backdrop{background:#02030ab3}dialog.code h2{margin:0 0 8px;font-size:18px}dialog.code .help{color:var(--dim);margin:0 0 12px;font-size:13px;line-height:1.6}dialog.code textarea{box-sizing:border-box;width:100%;color:var(--ink);background:var(--bg);border:1px solid var(--line);resize:vertical;word-break:break-all;border-radius:3px;padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}dialog.code textarea:focus-visible{outline:2px solid var(--gold);outline-offset:1px}dialog.code .err{min-height:1.4em;color:var(--gold);margin:8px 0;font-size:13px}dialog.code .row{justify-content:flex-end;gap:8px;display:flex}dialog.code button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);cursor:pointer;border-radius:3px;padding:6px 14px;font-size:13px}dialog.code button:hover{border-color:var(--blue)}dialog.code button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}dialog.code button:disabled{opacity:.5;cursor:default}</style>
  <script type="module" crossorigin src="./assets/index-CSMPZjGA.js"></script>
</head>
<body>
<main class="shell">
  <div id="stage" class="stage"></div>
  <div class="bar" role="toolbar" aria-label="ゲームの設定">
    <button id="btn-full" type="button">全画面</button>
    <button id="btn-mute" type="button" aria-pressed="false">消音</button>
    <button id="btn-ds" type="button">DualSense 連携</button>
    <button id="btn-code" type="button">リプレイを読み込む</button>
    <span class="keys">移動 矢印 / WASD　ショット 自動（ボタンなし）　ポーズ ESC　｜　ゲームパッド対応（PS5 推奨）</span>
    <span id="status" class="note" role="status"></span>
  </div>
</main>
</body>
</html>
