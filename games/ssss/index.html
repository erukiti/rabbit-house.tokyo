<style>:root{--bg:#04050d;--panel:#0a0e22;--line:#25306a;--ink:#e8ecff;--dim:#7c86b0;--blue:#2f7dff;--gold:#ffd23a;--font-ui:"M PLUS 1p", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark}html,body{overscroll-behavior:none;height:100%}body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);margin:0;overflow:hidden}.shell{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}dialog.code{touch-action:manipulation}.shell{box-sizing:border-box;flex-direction:column;gap:10px;height:100%;padding-block:12px;padding-inline:16px;display:flex}.stage{flex:1;place-items:center;min-height:0;display:grid}.screen{max-width:100%;box-shadow:0 0 0 1px var(--line), 0 24px 70px #000000a6;border-radius:4px;display:block}.bar{color:var(--dim);flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 14px;font-size:13px;display:flex}.bar button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);cursor:pointer;border-radius:3px;padding:6px 12px;font-size:13px}.bar button:hover{border-color:var(--blue)}.bar button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}.bar button[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}.keys{letter-spacing:.02em}.note{color:var(--gold)}dialog.code{box-sizing:border-box;background:var(--panel);width:min(640px,100vw - 32px);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:20px}dialog.code::backdrop{background:#02030ab3}dialog.code h2{margin:0 0 8px;font-size:18px}dialog.code .help{color:var(--dim);margin:0 0 12px;font-size:13px;line-height:1.6}dialog.code textarea{box-sizing:border-box;width:100%;color:var(--ink);background:var(--bg);border:1px solid var(--line);resize:vertical;word-break:break-all;border-radius:3px;padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}dialog.code textarea:focus-visible{outline:2px solid var(--gold);outline-offset:1px}dialog.code .err{min-height:1.4em;color:var(--gold);margin:8px 0;font-size:13px}dialog.code .row{justify-content:flex-end;gap:8px;display:flex}dialog.code button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);cursor:pointer;border-radius:3px;padding:6px 14px;font-size:13px}dialog.code button:hover{border-color:var(--blue)}dialog.code button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}dialog.code button:disabled{opacity:.5;cursor:default}.touch{flex:none;justify-content:space-between;align-items:center;gap:12px;height:168px;display:none}body.touch-mode .touch{display:flex}body.touch-mode .keys{display:none}.stick-zone{flex:1;align-self:stretch;position:relative}.stick-base{box-sizing:border-box;border:2px solid var(--line);pointer-events:none;background:#2f7dff14;border-radius:50%;width:120px;height:120px;position:absolute;top:calc(50% - 60px);left:24px}.stick-knob{box-sizing:border-box;background:#2ff3ff47;border:2px solid #2ff3ff;border-radius:50%;width:50px;height:50px;position:absolute;top:33px;left:33px}.stick-zone.on .stick-base{border-color:#2ff3ff}.tbtns{grid-template-rows:auto auto;grid-template-columns:auto auto;place-items:center;gap:10px 14px;padding-right:8px;display:grid}.tbtn{box-sizing:border-box;border:2px solid var(--line);background:var(--panel);width:68px;height:68px;color:var(--ink);font:700 20px var(--font-ui);border-radius:50%;flex-direction:column;justify-content:center;align-items:center;line-height:1.1;display:flex}.tbtn small{color:var(--dim);font-size:10px}.tbtn.ok{border-color:var(--gold);width:80px;height:80px;color:var(--gold);grid-area:2/2}.tbtn.back{grid-area:2/1}.tbtn.pause{border-radius:8px;grid-area:1/2;width:52px;height:34px;font-size:13px}.tbtn.on{background:#ffd23a47}@media (orientation:landscape){body.touch-mode .shell{padding-inline:200px}body.touch-mode .touch{pointer-events:none;height:auto;position:fixed;inset:0}body.touch-mode .stick-zone{pointer-events:auto;width:200px;height:75%;position:fixed;bottom:0;left:0}body.touch-mode .tbtns{pointer-events:auto;position:fixed;bottom:28px;right:16px}}</style>

<body>
<main class="shell">
  <div id="stage" class="stage"></div>
  <div id="touch" class="touch"></div>
  <div class="bar" role="toolbar" aria-label="ゲームの設定">
    <button id="btn-full" type="button">全画面</button>
    <button id="btn-mute" type="button" aria-pressed="false">消音</button>
    <button id="btn-ds" type="button">DualSense 連携</button>
    <button id="btn-code" type="button">リプレイを読み込む</button>
    <span class="keys">移動 矢印 / WASD　ショット 自動（ボタンなし）　ポーズ ESC　｜　ゲームパッド対応（PS5 推奨）</span>
    <span id="status" class="note" role="status"></span>
  </div>
</main>
<script>
  // ゲームのプログラムが読み込めない時（古いブラウザで書き方を解釈できないなど）や、起動しない時も、理由を画面の下に出す
  (function () {
    function say(t) {
      var s = document.getElementById('status');
      if (s) s.textContent = t;
    }
    window.addEventListener('error', function (e) {
      if (window.__ssssStarted) return;
      say('エラー: ' + (e.message || e.error) + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ':' + e.colno + ')' : ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      if (window.__ssssStarted) return;
      say('エラー: ' + ((e.reason && e.reason.message) || e.reason));
    });
    setTimeout(function () {
      if (!window.__ssssStarted) say('起動できませんでした: ' + navigator.userAgent);
    }, 8000);
  })();
</script>
