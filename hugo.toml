baseURL = "https://rabbit-house.tokyo/"
locale = "ja"
defaultContentLanguage = "ja"
title = "東京ラビットハウス"
hasCJKLanguage = true
timeZone = "Asia/Tokyo"
publishDir = ".cache/site"
disableKinds = ["404"]
ignoreLogs = ["warning-goldmark-raw-html"]

[module.hugoVersion]
  min = "0.167.0"

[params]
  viewMorePostLink = "/blog/"
  author = "erukiti"
  email = "erukiti@gmail.com"
  logo = "img/logo.jpg"
  about_us = "東京ラビットハウス"
  copyright = "Copyright (c) 2017, Tokyo Rabbit House; all rights reserved."
  date_format = "2006/01/02"

[[params.menu]]
  name = "同人誌・書籍"
  url = "/books/"
  weight = 1

[[params.menu]]
  name = "Blog"
  url = "/blog/"
  weight = 2

[[params.menu]]
  name = "Contact"
  url = "/contact/"
  weight = 3

[outputs]
  taxonomy = ["RSS"]
  term = ["RSS"]

[markup.goldmark.renderer]
  unsafe = false
